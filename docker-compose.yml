name: n8n Workflow Automation

services:
  n8n:
    image: ghcr.io/n8n-io/n8n:2.27.4@sha256:cf11c96b0d0089bb24459bf97b445fd7008f41543b673cce4d955f7c0ed8752d
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_storage:/home/node/.n8n
      - /opt/docker/n8n/n8n.key:/var/run/secrets/n8n.key
      - /opt/docker/rootca/root-ca.cert.pem:/usr/local/share/ca-certificates/local-root-ca.crt:ro
    secrets:
     - source: server-cert
       target: n8n.crt
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - N8N_HOST=${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_SECURE_COOKIE=true
      - N8N_SSL_CERT=/var/run/secrets/n8n.crt
      - N8N_SSL_KEY=/var/run/secrets/n8n.key
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/local-root-ca.crt
      - NODE_OPTIONS=${NODE_OPTIONS}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,https,url
      - NODES_EXCLUDE=${NODES_EXCLUDE:-[\"n8n-nodes-base.executeCommand\", \"n8n-nodes-base.localFileTrigger\"]}
      - N8N_PROXY_HOPS=1
      - N8N_INSECURE_DISABLE_WEBHOOK_IFRAME_SANDBOX=true
      - WEBHOOK_URL=https://${PUBLIC_WEBHOOK_DOMAIN_NAME}
    ports:
      - '5678:5678'
    networks:
      egress_net:
        gw_priority: 1
      proxy_net:
        aliases:
          - n8n.local
      n8n_internal:
    restart: always
    links:
      - postgres
        
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    networks:
      - n8n_internal
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  n8n_internal:
    internal: true
    name: n8n_internal_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.12.64/28
          gateway: 172.27.12.65
  proxy_net:
    external: true
    name: network_backend_net
  egress_net:
    name: n8n_egress_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.12.80/30
          gateway: 172.27.12.81

volumes:
  db_storage:
  n8n_storage:

secrets:
  server-cert:
    file: "/opt/docker/rootca/public/n8n.crt"
